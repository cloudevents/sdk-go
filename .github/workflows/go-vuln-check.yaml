name: Vulnerability Check

on:
  push:
    branches: [ 'main', 'release-*' ]
  pull_request:
    branches: [ 'main', 'release-*' ]
  schedule:
    # Daily, so new advisories surface without waiting for a code change
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26
          # The runner's cached Go patch release lags, and govulncheck reports stdlib CVEs against it
          check-latest: true
          cache-dependency-path: v2/go.sum

      - name: Run govulncheck
        run: ./hack/vuln-check.sh
